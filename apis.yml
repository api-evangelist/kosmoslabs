aid: kosmoslabs
name: Kosmos AI Labs
description: >-
  Kosmos AI Labs builds an operational intelligence platform that correlates signals across
  fragmented enterprise systems — Jira, Salesforce Service Cloud, GitHub, ServiceNow, Zendesk,
  Linear, Bitbucket, Azure DevOps, Pylon and OpenTelemetry — to surface Risk Events with ranked
  causes and supporting evidence for customer-impacting incidents. The platform operates on a
  "machines propose, humans confirm" trust model: it proposes root-cause analysis in under sixty
  seconds and a human confirms, building organizational memory that keeps incidents from
  recurring. Its public developer surface is an OpenTelemetry (OTLP) ingest API at
  ingest.kosmoslabs.ai accepting traces, metrics and logs over HTTP and gRPC, authenticated with
  a kos_-prefixed API key; every other system is connected through read-only OAuth integration
  scopes rather than a public REST API.
